model: storage_cluster
title: A generic scale-out storage cluster
currency: USD

description: >-
  Sized from a stated workload and costed over five years. This is the book's cost-model
  exemplar: its structure is accounting identities and physics, its inputs are uncertain, and
  almost nothing in it changes regime. Sampling the inputs is genuinely sufficient here, and the
  reason that claim is worth making is that the observability model next door shows what it looks
  like when it is not.

  Vendor-neutral by construction. Nothing below names a product; every figure is either a
  workload assumption, a price you would get quoted, or one measured constant.

nodes:

  # -- the workload ------------------------------------------------------------------------

  usable_capacity_t0:
    kind: input
    unit: TB
    value: 4000
    label: usable capacity, day one
    provenance:
      kind: assumption
      source: "stated workload (ch02) — what the application says it needs to store today"
    range: [500, 20000]

  annual_growth:
    kind: input
    unit: dimensionless
    label: annual growth factor
    distribution: {lognormal: {p10: 1.12, p90: 1.60}}
    provenance:
      kind: assumption
      source: "ch04 — lognormal because growth compounds and cannot be negative. The p10/p90
        say: surprised below 12% a year, surprised above 60%."
    range: [1.0, 2.0]

  horizon:
    kind: input
    unit: year
    value: 5
    provenance:
      kind: assumption
      source: "the refresh cycle this cluster is bought against"
    range: [3, 8]

  one_year:
    kind: input
    unit: year
    value: 1
    label: one year
    note: >-
      Here because a duration cannot be an exponent. In (1+r)^n the n is a pure number, so the
      horizon has to be divided by something with the same units before it can be used as one.
      Appendix D has the rest of the conversions that bite.
    provenance: {kind: fact, source: "definition"}

  horizon_periods:
    kind: derived
    unit: dimensionless
    formula: horizon / one_year

  peak_read_throughput:
    kind: input
    unit: GB/s
    label: peak read throughput
    distribution: {triangular: {minimum: 35.0, likely: 85.0, maximum: 240.0}}
    provenance:
      kind: assumption
      source: "ch04 — the busy hour, not the average. Triangular because this is an engineer's
        min/likely/max and pretending to more shape than that would be invention."
    range: [10, 400]

  # -- capacity: from what you need to what you must buy ------------------------------------

  usable_capacity:
    kind: derived
    unit: TB
    label: usable capacity at horizon
    formula: usable_capacity_t0 * annual_growth ** horizon_periods

  object_compression:
    kind: measured
    unit: dimensionless
    label: object compression ratio
    result: storage-object-compression

  replication_factor:
    kind: input
    unit: dimensionless
    value: 3
    provenance:
      kind: assumption
      source: "three copies. An erasure-coded cluster substitutes its own overhead factor here
        and the rest of the model is unchanged, which is the point of it being a node."
    range: [1, 4]

  metadata_overhead:
    kind: input
    unit: dimensionless
    distribution: {triangular: {minimum: 1.02, likely: 1.06, maximum: 1.14}}
    provenance:
      kind: assumption
      source: "filesystem, index and journal overhead as a multiplier on stored bytes.
        Triangular, and the bounds are for objects of the size this model assumes — the real
        spread is a function of object size, which is a term ch09 says this model lacks"

  raw_per_usable:
    kind: derived
    unit: dimensionless
    label: raw bytes per usable byte
    formula: replication_factor * metadata_overhead / object_compression

  raw_capacity:
    kind: derived
    unit: TB
    label: raw capacity needed
    formula: usable_capacity * raw_per_usable

  drive_capacity:
    kind: input
    unit: TB/drive
    value: 20
    provenance:
      kind: vendor_claim
      source: "datasheet capacity. Decimal TB, not TiB — appendix D, and it is a 10% difference"

  drives_per_node:
    kind: input
    unit: drive/node
    value: 12
    provenance: {kind: assumption, source: "chassis choice"}
    range: [6, 36]

  node_raw_capacity:
    kind: derived
    unit: TB/node
    formula: drive_capacity * drives_per_node

  capacity_headroom:
    kind: input
    unit: dimensionless
    value: 0.25
    label: capacity headroom
    provenance:
      kind: assumption
      source: "ch11 — rebuild reserve plus allocator behaviour near full. One node's worth of
        data has to land somewhere when a node dies, and a filesystem at 97% is a different
        filesystem."
    range: [0.0, 0.45]

  nodes_for_capacity:
    kind: derived
    unit: node
    formula: ceil(raw_capacity / (node_raw_capacity * (1 - capacity_headroom)))

  # -- bandwidth: the other chain, and the one that sometimes wins ---------------------------

  node_read_throughput:
    kind: input
    unit: GB/s/node
    distribution: {triangular: {minimum: 1.1, likely: 1.7, maximum: 2.4}}
    provenance:
      kind: vendor_claim
      source: "sustained sequential read per node, as quoted. Unverified here — ch03.
        Triangular, and the lower bound is the one doing the work: the quoted figure is
        sequential and a real read pattern is not"

  nodes_for_throughput:
    kind: derived
    unit: node
    formula: ceil(peak_read_throughput / node_read_throughput)

  nodes_recommended:
    kind: derived
    unit: node
    label: nodes the model recommends
    note: >-
      The first place a reader meets a binding constraint. Two independent chains produce two
      node counts and you buy the larger, which means that across this model's uncertainty the
      answer is sometimes set by capacity and sometimes by bandwidth — and an average of the two
      is a cluster that satisfies neither.
    formula: max(nodes_for_capacity, nodes_for_throughput)

  nodes_purchased:
    kind: input
    unit: node
    value: 121
    label: nodes purchased
    note: >-
      **The most important node in this model, and the one a spreadsheet hides.** Sizing does not
      produce a cluster; it produces a recommendation, and then a person decides. That decision
      is made once, before the five years happen, and everything downstream of it — every dollar
      of capital, every watt, every ceiling — is a consequence of the number chosen here and not
      of the number the model would recommend in hindsight.

      Deriving it instead would make the ceilings below tautologies: a cluster sized to satisfy
      a fill limit satisfies it in every sample, and the model would cheerfully report a zero
      per cent chance of running out of space. Making it an input is what lets the ceilings ask
      the only question worth asking — *given what we actually bought, how often does the world
      break it?*
    provenance:
      kind: assumption
      source: "the sizing decision, taken the way it is usually taken: nodes_recommended
        evaluated at every input's point estimate. That is exactly 121, and the ceilings below
        are what the same model says about that decision once the inputs are allowed to be
        uncertain. Change this number and watch them move — that is the exercise of ch12"
    range: [40, 500]

  installed_raw_capacity:
    kind: derived
    unit: TB
    formula: nodes_purchased * node_raw_capacity

  installed_read_throughput:
    kind: derived
    unit: GB/s
    formula: nodes_purchased * node_read_throughput

  fill_level:
    kind: ceiling
    unit: dimensionless
    label: fill level at horizon
    of: raw_capacity / installed_raw_capacity
    limit: 1
    headroom: capacity_headroom
    because: >-
      A cluster that is full cannot rebuild a failed node, and one that is nearly full allocates
      badly long before that. The margin is the same node the sizing used, so the two cannot
      drift apart (ch11). Over the limit means out of space; inside the headroom means the
      rebuild reserve has been spent on data.

  read_utilisation:
    kind: ceiling
    unit: dimensionless
    label: read utilisation at peak
    of: peak_read_throughput / installed_read_throughput
    limit: 1
    headroom: 0.3
    because: >-
      Not a hard limit but a queueing one (ch06). Response time climbs long before a device is
      saturated, so the margin here is about latency rather than capacity — which is why it is
      a different number from capacity_headroom and declared separately rather than shared.

  # -- capital ------------------------------------------------------------------------------

  drives_total:
    kind: derived
    unit: drive
    formula: nodes_purchased * drives_per_node

  drive_price:
    kind: input
    unit: USD/TB
    distribution: {lognormal: {p10: 10.5, p90: 19.0}}
    provenance:
      kind: vendor_claim
      source: "street price per decimal TB at this capacity point, three quotes. Lognormal
        because prices move by ratios rather than by amounts, and because three quotes give a
        centre and a spread rather than a shape"

  drive_capex:
    kind: derived
    unit: USD
    formula: drives_total * drive_capacity * drive_price

  chassis_price:
    kind: input
    unit: USD/node
    distribution: {lognormal: {p10: 8500, p90: 16000}}
    provenance:
      kind: vendor_claim
      source: "chassis, CPU, memory and boot media, less drives. Lognormal like any price, and
        wider than the drives' because a chassis is a configuration rather than a commodity —
        which is why ch19 finds it at the top of the tornado"

  chassis_capex:
    kind: derived
    unit: USD
    formula: nodes_purchased * chassis_price

  network_price_per_node:
    kind: input
    unit: USD/node
    distribution: {triangular: {minimum: 900, likely: 1500, maximum: 2800}}
    provenance:
      kind: assumption
      source: "switch ports, optics and cabling, amortised per node. Triangular rather than
        lognormal, although it is a price: it is a bill of materials divided by a node count
        somebody chose, so the bounds are the plausible designs rather than a market"

  network_capex:
    kind: derived
    unit: USD
    formula: nodes_purchased * network_price_per_node

  capex:
    kind: derived
    unit: USD
    formula: drive_capex + chassis_capex + network_capex

  # -- running it ----------------------------------------------------------------------------

  node_power:
    kind: input
    unit: W/node
    distribution: {triangular: {minimum: 360, likely: 450, maximum: 640}}
    provenance:
      kind: vendor_claim
      source: "typical draw under load, per chassis as configured. Triangular, and one of the
        few inputs here whose bounds are physical rather than editorial: a chassis cannot draw
        less than it idles at, or more than its supply will give it"

  pue:
    kind: input
    unit: dimensionless
    label: PUE
    distribution: {triangular: {minimum: 1.15, likely: 1.35, maximum: 1.75}}
    provenance:
      kind: assumption
      source: "ch15 — facility overhead. A multiplier on IT load, and the single number a
        colocation contract is most likely to disagree with you about. Triangular: the minimum
        is a good building, the maximum is a poor one, and below one is impossible"
    range: [1.0, 2.2]

  facility_power:
    kind: derived
    unit: kW
    note: "watts in, kilowatts out — the build converts, nobody divides by a thousand by hand"
    formula: nodes_purchased * node_power * pue

  hours_per_year:
    kind: input
    unit: hour/year
    value: 8766
    provenance:
      kind: fact
      source: "by definition, 365.25 x 24. The quarter-day is worth about a fifth of a per cent
        over five years — less than this model's other errors, and free to get right"

  annual_energy:
    kind: derived
    unit: kWh/year
    formula: facility_power * hours_per_year

  electricity_price:
    kind: input
    unit: USD/kWh
    distribution: {lognormal: {p10: 0.085, p90: 0.21}}
    provenance:
      kind: assumption
      source: "all-in delivered rate including transmission. Lognormal: it cannot go negative and
        its history is multiplicative"
    range: [0.04, 0.45]

  annual_energy_cost:
    kind: derived
    unit: USD/year
    formula: annual_energy * electricity_price

  support_rate:
    kind: input
    unit: 1/year
    distribution: {triangular: {minimum: 0.07, likely: 0.11, maximum: 0.18}}
    provenance:
      kind: vendor_claim
      source: "annual support as a fraction of capital cost. Triangular because it is
        negotiated inside a band the market sets rather than drawn from one: the spread is
        what different buyers get, not what varies from year to year"

  annual_support:
    kind: derived
    unit: USD/year
    formula: capex * support_rate

  staff_fte:
    kind: input
    unit: dimensionless
    distribution: {triangular: {minimum: 0.2, likely: 0.5, maximum: 1.2}}
    provenance:
      kind: assumption
      source: "fraction of one engineer this cluster occupies. Triangular, and the shape
        cannot express what actually happens: people are not divisible, so the real
        distribution is lumpy in the way ch08 calls a regime change"

  fully_loaded_salary:
    kind: input
    unit: USD/year
    distribution: {lognormal: {p10: 115000, p90: 195000}}
    provenance:
      kind: assumption
      source: "salary, employer costs, tooling and overhead. Lognormal because pay is
        right-skewed and cannot go negative; the p90 is a senior engineer in an expensive city"

  annual_staff_cost:
    kind: derived
    unit: USD/year
    formula: staff_fte * fully_loaded_salary

  annual_opex:
    kind: derived
    unit: USD/year
    formula: annual_energy_cost + annual_support + annual_staff_cost

  lifecycle_opex:
    kind: derived
    unit: USD
    formula: annual_opex * horizon

  tco:
    kind: derived
    unit: USD
    label: five-year total cost of ownership
    formula: capex + lifecycle_opex

  # -- unit economics -------------------------------------------------------------------------

  average_usable_capacity:
    kind: derived
    unit: TB
    note: >-
      The mean of the day-one and horizon capacities: a straight line drawn under a curve that
      is not straight, which understates the area. Stated rather than hidden, because a unit cost
      is only as defensible as its denominator (ch17).
    formula: (usable_capacity_t0 + usable_capacity) / 2

  cost_per_usable_tb_month:
    kind: derived
    unit: USD/TB/month
    label: cost per usable TB per month
    note: >-
      The formula divides by a horizon in years and the node is declared in months. Those two
      have identical dimensions and differ by a factor of twelve, so a check that compared only
      dimensions would publish a figure twelve times too large and pass. sizing/units.py converts.
    formula: tco / average_usable_capacity / horizon

outputs:
  - nodes_recommended
  - nodes_purchased
  - tco
  - cost_per_usable_tb_month
  - capex
  - annual_opex
  - fill_level
  - read_utilisation

correlations:
  - a: drive_price
    b: chassis_price
    rho: 0.5
    because: >-
      Both are quoted by the same supply chain in the same quarter. A year when drives are scarce
      is usually a year when servers are, and treating them as independent narrows the interval
      on capital cost by pretending one can save you from the other.

  - a: annual_growth
    b: peak_read_throughput
    rho: 0.6
    because: >-
      More data stored is usually more data read. This one changes the answer rather than just
      the interval: the two chains that compete inside nodes_total are driven by these two
      inputs, so correlating them changes how often each constraint binds.
