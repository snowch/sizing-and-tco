# How the storage model is built, one chapter at a time.
#
# The book introduces this model a few nodes at a time, and each chapter shows the file as it
# stands at the end of it. Those files are *derived from model.yaml* rather than kept beside it:
# a second copy would drift, and the book would go on describing a model the repository no
# longer has. `bench/stages.py` builds them, `tests/test_stages.py` checks that every node is
# introduced by some chapter, that a stage never takes anything away, and that the
# classification flips exactly where the book says it does.
#
# `introduces` is the whole of it. Every node in model.yaml appears in exactly one stage, and a
# stage whose nodes refer to something no earlier stage introduced will not load.

# Two inputs are plain numbers until ch04 gives them shapes. A stage before that declares the
# value somebody would have chosen, and a provenance that says the distribution is coming — the
# only edit a stage may make to a node, because any other would let it show something the
# finished model does not say.
# How a stage refers to the model in its one-line description.
describe: storage model

certain_until:
  annual_growth:
    stage: uncertainty
    value: 1.3
    source: >-
      ch02 - one growth rate, chosen rather than measured. ch04 replaces it with a distribution,
      because a single number cannot say how sure anybody is of it.
  peak_read_throughput:
    stage: uncertainty
    value: 85
    source: >-
      ch02 - the busy hour, as one number. ch04 replaces it with a distribution, because an
      engineer who gives you this figure is giving you a range and rounding it.

stages:
  - stage: demand
    chapter: what_a_workload_is
    title: What arrives, and what accumulates
    classification: cost
    outputs: [usable_capacity, peak_read_throughput]
    introduces:
      - usable_capacity_t0
      - annual_growth
      - horizon
      - one_year
      - horizon_periods
      - usable_capacity
      - peak_read_throughput

  - stage: provenance
    chapter: where_the_numbers_come_from
    title: The first number somebody else supplied
    classification: cost
    outputs: [usable_capacity, peak_read_throughput, node_raw_capacity]
    introduces:
      - drive_capacity
      - drives_per_node
      - node_raw_capacity

  - stage: uncertainty
    chapter: peak_mean_and_growth
    title: The growth rate stops being a number
    classification: cost
    outputs: [usable_capacity, peak_read_throughput, node_raw_capacity]
    introduces: []

  - stage: capacity
    chapter: capacity
    title: A measured constant, a ceiling, and a change of kind
    classification: sizing
    # peak_read_throughput is still only an echo of what ch02 was given: nothing consumes it
    # until ch10 adds the second chain. A stage reports the workload it was handed.
    outputs: [usable_capacity, peak_read_throughput, nodes_for_capacity, fill_level]
    introduces:
      - object_compression
      - replication_factor
      - metadata_overhead
      - raw_per_usable
      - raw_capacity
      - capacity_headroom
      - nodes_for_capacity
      - nodes_purchased
      - installed_raw_capacity
      - fill_level

  - stage: bandwidth
    chapter: bandwidth_and_the_binding_constraint
    title: The second chain, and which one binds
    classification: sizing
    outputs: [nodes_recommended, nodes_purchased, fill_level, read_utilisation]
    introduces:
      - node_read_throughput
      - nodes_for_throughput
      - nodes_recommended
      - installed_read_throughput
      - read_utilisation

  - stage: cost
    chapter: the_five_year_model
    title: What the cluster costs
    classification: sizing
    outputs: [nodes_recommended, nodes_purchased, tco, cost_per_usable_tb_month,
              capex, annual_opex, fill_level, read_utilisation]
    introduces:
      - drives_total
      - drive_price
      - drive_capex
      - chassis_price
      - chassis_capex
      - network_price_per_node
      - network_capex
      - capex
      - node_power
      - pue
      - facility_power
      - hours_per_year
      - annual_energy
      - electricity_price
      - annual_energy_cost
      - support_rate
      - annual_support
      - staff_fte
      - fully_loaded_salary
      - annual_staff_cost
      - annual_opex
      - lifecycle_opex
      - tco
      - average_usable_capacity
      - cost_per_usable_tb_month
