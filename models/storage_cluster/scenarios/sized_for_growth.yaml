scenario: sized_for_growth
title: Sized for the growth we might get, not the growth we expect
because: >-
  The reference scenario buys what the point estimates recommend, and the model then puts a third
  of its futures over the capacity limit. This scenario buys the cluster the p90 growth case needs
  instead, and is here so the two can be read side by side: what the extra capital buys is a
  number, the reduction in P(over) is a number, and the decision between them is a judgement
  somebody has to make and defend (ch21).
