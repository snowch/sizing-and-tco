# Generated by bench/stages.py from models/storage_cluster/model.yaml.
# Do not edit: say which chapter introduces the node in build-order.yaml instead.
model: storage_cluster_demand
title: A generic scale-out storage cluster — What arrives, and what accumulates
currency: USD
description: 'The storage model as it stands at the end of what_a_workload_is, built by bench/stages.py
  from models/storage_cluster/model.yaml. Not a model anybody would ship: it is the finished model with
  everything the book has not introduced yet removed, so that a reader can see what it looked like when
  it had 7 nodes in it.'
nodes:
  usable_capacity_t0:
    kind: input
    unit: TB
    value: 4000
    label: usable capacity, day one
    provenance:
      kind: assumption
      source: stated workload (ch02) — what the application says it needs to store today
    range:
    - 500
    - 20000
  annual_growth:
    kind: input
    unit: dimensionless
    label: annual growth factor
    provenance:
      kind: assumption
      source: ch02 - one growth rate, chosen rather than measured. ch04 replaces it with a distribution,
        because a single number cannot say how sure anybody is of it.
    range:
    - 1.0
    - 2.0
    value: 1.3
  horizon:
    kind: input
    unit: year
    value: 5
    provenance:
      kind: assumption
      source: the refresh cycle this cluster is bought against
    range:
    - 3
    - 8
  one_year:
    kind: input
    unit: year
    value: 1
    label: one year
    note: Here because a duration cannot be an exponent. In (1+r)^n the n is a pure number, so the horizon
      has to be divided by something with the same units before it can be used as one. Appendix D has
      the rest of the conversions that bite.
    provenance:
      kind: fact
      source: definition
  horizon_periods:
    kind: derived
    unit: dimensionless
    formula: horizon / one_year
  peak_read_throughput:
    kind: input
    unit: GB/s
    label: peak read throughput
    provenance:
      kind: assumption
      source: ch02 - the busy hour, as one number. ch04 replaces it with a distribution, because an
        engineer who gives you this figure is giving you a range and rounding it.
    range:
    - 10
    - 400
    value: 85
  usable_capacity:
    kind: derived
    unit: TB
    label: usable capacity at horizon
    formula: usable_capacity_t0 * annual_growth ** horizon_periods
outputs:
- usable_capacity
- peak_read_throughput
correlations: []
