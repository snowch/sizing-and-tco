# Generated by bench/stages.py from models/storage_cluster/model.yaml.
# The finished model with everything the book has not introduced by the end of ch08 removed,
# so that a reader can see it at 20 nodes. Not a model anybody would ship.
# Do not edit: say which chapter introduces a node in build-order.yaml instead.
model: storage_cluster_capacity
title: A generic scale-out storage cluster — A measured constant, a ceiling, and a change of kind
currency: USD
description: The storage model as it stands at the end of ch08.
nodes:
  usable_capacity_t0:
    kind: input
    unit: TB
    value: 4000
    label: usable capacity, day one
    provenance:
      kind: assumption
      source: stated workload (ch01) — what the application says it needs to store today
    range:
    - 500
    - 20000
  annual_growth:
    kind: input
    unit: dimensionless
    label: annual growth factor
    distribution:
      lognormal:
        p10: 1.12
        p90: 1.6
    provenance:
      kind: assumption
      source: 'ch03 — lognormal because growth compounds and cannot be negative. The p10/p90 say: surprised
        below 12% a year, surprised above 60%.'
    range:
    - 1.0
    - 2.0
  horizon:
    kind: input
    unit: year
    value: 5
    provenance:
      kind: assumption
      source: the refresh cycle this cluster is bought against
    range:
    - 3
    - 8
  one_year:
    kind: input
    unit: year
    value: 1
    label: one year
    note: Here because a duration cannot be an exponent. In (1+r)^n the n is a pure number, so the horizon
      has to be divided by something with the same units before it can be used as one. Appendix D has
      the rest of the conversions that bite.
    provenance:
      kind: fact
      source: definition
  horizon_periods:
    kind: derived
    unit: dimensionless
    formula: horizon / one_year
  peak_read_throughput:
    kind: input
    unit: GB/s
    label: peak read throughput
    distribution:
      triangular:
        minimum: 35.0
        likely: 85.0
        maximum: 240.0
    provenance:
      kind: assumption
      source: ch03 — the busy hour, not the average. Triangular because this is an engineer's min/likely/max
        and pretending to more shape than that would be invention.
    range:
    - 10
    - 400
  usable_capacity:
    kind: derived
    unit: TB
    label: usable capacity at horizon
    formula: usable_capacity_t0 * annual_growth ** horizon_periods
  object_compression:
    kind: measured
    unit: dimensionless
    label: object compression ratio
    result: storage-object-compression
  replication_factor:
    kind: input
    unit: dimensionless
    value: 3
    provenance:
      kind: assumption
      source: three copies. An erasure-coded cluster substitutes its own overhead factor here and the
        rest of the model is unchanged, which is the point of it being a node.
    range:
    - 1
    - 4
  metadata_overhead:
    kind: input
    unit: dimensionless
    distribution:
      triangular:
        minimum: 1.02
        likely: 1.06
        maximum: 1.14
    provenance:
      kind: assumption
      source: filesystem, index and journal overhead as a multiplier on stored bytes. Triangular, and
        the bounds are for objects of the size this model assumes — the real spread is a function of
        object size, which is a term ch08 says this model lacks
  raw_per_usable:
    kind: derived
    unit: dimensionless
    label: raw bytes per usable byte
    formula: replication_factor * metadata_overhead / object_compression
  raw_capacity:
    kind: derived
    unit: TB
    label: raw capacity needed
    formula: usable_capacity * raw_per_usable
  drive_capacity:
    kind: input
    unit: TB/drive
    value: 20
    provenance:
      kind: vendor_claim
      source: datasheet capacity. Decimal TB, not TiB — appendix D, and it is a 10% difference
  drives_per_node:
    kind: input
    unit: drive/node
    value: 12
    provenance:
      kind: assumption
      source: chassis choice
    range:
    - 6
    - 36
  node_raw_capacity:
    kind: derived
    unit: TB/node
    formula: drive_capacity * drives_per_node
  capacity_headroom:
    kind: input
    unit: dimensionless
    value: 0.25
    label: capacity headroom
    provenance:
      kind: assumption
      source: ch10 — rebuild reserve plus allocator behaviour near full. One node's worth of data has
        to land somewhere when a node dies, and a filesystem at 97% is a different filesystem.
    range:
    - 0.0
    - 0.45
  nodes_for_capacity:
    kind: derived
    unit: node
    formula: ceil(raw_capacity / (node_raw_capacity * (1 - capacity_headroom)))
  nodes_purchased:
    kind: input
    unit: node
    value: 121
    label: nodes purchased
    note: '**The most important node in this model, and the one a spreadsheet hides.** Sizing does not
      produce a cluster; it produces a recommendation, and then a person decides. That decision is made
      once, before the five years happen, and everything downstream of it — every dollar of capital,
      every watt, every ceiling — is a consequence of the number chosen here and not of the number the
      model would recommend in hindsight.

      Deriving it instead would make the ceilings below tautologies: a cluster sized to satisfy a fill
      limit satisfies it in every sample, and the model would cheerfully report a zero per cent chance
      of running out of space. Making it an input is what lets the ceilings ask the only question worth
      asking — *given what we actually bought, how often does the world break it?*'
    provenance:
      kind: assumption
      source: 'the sizing decision, taken the way it is usually taken: nodes_recommended evaluated at
        every input''s point estimate. That is exactly 121, and the ceilings below are what the same
        model says about that decision once the inputs are allowed to be uncertain. Change this number
        and watch them move — that is the exercise of ch11'
    range:
    - 40
    - 500
  installed_raw_capacity:
    kind: derived
    unit: TB
    formula: nodes_purchased * node_raw_capacity
  fill_level:
    kind: ceiling
    unit: dimensionless
    label: fill level at horizon
    of: raw_capacity / installed_raw_capacity
    limit: 1
    headroom: capacity_headroom
    because: A cluster that is full cannot rebuild a failed node, and one that is nearly full allocates
      badly long before that. The margin is the same node the sizing used, so the two cannot drift apart
      (ch10). Over the limit means out of space; inside the headroom means the rebuild reserve has been
      spent on data.
outputs:
- usable_capacity
- peak_read_throughput
- nodes_for_capacity
- fill_level
correlations:
- a: annual_growth
  b: peak_read_throughput
  rho: 0.6
  because: 'More data stored is usually more data read. This one changes the answer rather than just
    the interval: the two chains that compete inside nodes_total are driven by these two inputs, so
    correlating them changes how often each constraint binds.'
