# Generated by bench/stages.py from models/storage_cluster/model.yaml.
# The finished model with everything the book has not introduced by the end of ch02 removed,
# so that a reader can see it at 10 nodes. Not a model anybody would ship.
# Do not edit: say which chapter introduces a node in build-order.yaml instead.
model: storage_cluster_provenance
title: A generic scale-out storage cluster — The first number somebody else supplied
currency: USD
description: The storage model as it stands at the end of ch02.
nodes:
  usable_capacity_t0:
    kind: input
    unit: TB
    value: 4000
    label: usable capacity, day one
    provenance:
      kind: assumption
      source: stated workload (ch01) — what the application says it needs to store today
    range:
    - 500
    - 20000
  annual_growth:
    kind: input
    unit: dimensionless
    label: annual growth factor
    provenance:
      kind: assumption
      source: ch01 - one growth rate, chosen rather than measured. ch03 replaces it with a distribution,
        because a single number cannot say how sure anybody is of it.
    range:
    - 1.0
    - 2.0
    value: 1.3
  horizon:
    kind: input
    unit: year
    value: 5
    provenance:
      kind: assumption
      source: the refresh cycle this cluster is bought against
    range:
    - 3
    - 8
  one_year:
    kind: input
    unit: year
    value: 1
    label: one year
    note: Here because a duration cannot be an exponent. In (1+r)^n the n is a pure number, so the horizon
      has to be divided by something with the same units before it can be used as one. Appendix D has
      the rest of the conversions that bite.
    provenance:
      kind: fact
      source: definition
  horizon_periods:
    kind: derived
    unit: dimensionless
    formula: horizon / one_year
  peak_read_throughput:
    kind: input
    unit: GB/s
    label: peak read throughput
    provenance:
      kind: assumption
      source: ch01 - the busy hour, as one number. ch03 replaces it with a distribution, because an
        engineer who gives you this figure is giving you a range and rounding it.
    range:
    - 10
    - 400
    value: 85
  usable_capacity:
    kind: derived
    unit: TB
    label: usable capacity at horizon
    formula: usable_capacity_t0 * annual_growth ** horizon_periods
  drive_capacity:
    kind: input
    unit: TB/drive
    value: 20
    provenance:
      kind: vendor_claim
      source: datasheet capacity. Decimal TB, not TiB — appendix D, and it is a 10% difference
  drives_per_node:
    kind: input
    unit: drive/node
    value: 12
    provenance:
      kind: assumption
      source: chassis choice
    range:
    - 6
    - 36
  node_raw_capacity:
    kind: derived
    unit: TB/node
    formula: drive_capacity * drives_per_node
outputs:
- usable_capacity
- peak_read_throughput
- node_raw_capacity
correlations: []
