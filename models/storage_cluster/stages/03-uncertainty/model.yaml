# Generated by bench/stages.py from models/storage_cluster/model.yaml.
# Do not edit: say which chapter introduces the node in build-order.yaml instead.
model: storage_cluster_uncertainty
title: A generic scale-out storage cluster — The growth rate stops being a number
currency: USD
description: 'The storage model as it stands at the end of peak_mean_and_growth, built by bench/stages.py
  from models/storage_cluster/model.yaml. Not a model anybody would ship: it is the finished model with
  everything the book has not introduced yet removed, so that a reader can see what it looked like when
  it had 10 nodes in it.'
nodes:
  usable_capacity_t0:
    kind: input
    unit: TB
    value: 4000
    label: usable capacity, day one
    provenance:
      kind: assumption
      source: stated workload (ch01) — what the application says it needs to store today
    range:
    - 500
    - 20000
  annual_growth:
    kind: input
    unit: dimensionless
    label: annual growth factor
    distribution:
      lognormal:
        p10: 1.12
        p90: 1.6
    provenance:
      kind: assumption
      source: 'ch03 — lognormal because growth compounds and cannot be negative. The p10/p90 say: surprised
        below 12% a year, surprised above 60%.'
    range:
    - 1.0
    - 2.0
  horizon:
    kind: input
    unit: year
    value: 5
    provenance:
      kind: assumption
      source: the refresh cycle this cluster is bought against
    range:
    - 3
    - 8
  one_year:
    kind: input
    unit: year
    value: 1
    label: one year
    note: Here because a duration cannot be an exponent. In (1+r)^n the n is a pure number, so the horizon
      has to be divided by something with the same units before it can be used as one. Appendix D has
      the rest of the conversions that bite.
    provenance:
      kind: fact
      source: definition
  horizon_periods:
    kind: derived
    unit: dimensionless
    formula: horizon / one_year
  peak_read_throughput:
    kind: input
    unit: GB/s
    label: peak read throughput
    distribution:
      triangular:
        minimum: 35.0
        likely: 85.0
        maximum: 240.0
    provenance:
      kind: assumption
      source: ch03 — the busy hour, not the average. Triangular because this is an engineer's min/likely/max
        and pretending to more shape than that would be invention.
    range:
    - 10
    - 400
  usable_capacity:
    kind: derived
    unit: TB
    label: usable capacity at horizon
    formula: usable_capacity_t0 * annual_growth ** horizon_periods
  drive_capacity:
    kind: input
    unit: TB/drive
    value: 20
    provenance:
      kind: vendor_claim
      source: datasheet capacity. Decimal TB, not TiB — appendix D, and it is a 10% difference
  drives_per_node:
    kind: input
    unit: drive/node
    value: 12
    provenance:
      kind: assumption
      source: chassis choice
    range:
    - 6
    - 36
  node_raw_capacity:
    kind: derived
    unit: TB/node
    formula: drive_capacity * drives_per_node
outputs:
- usable_capacity
- peak_read_throughput
- node_raw_capacity
correlations:
- a: annual_growth
  b: peak_read_throughput
  rho: 0.6
  because: 'More data stored is usually more data read. This one changes the answer rather than just
    the interval: the two chains that compete inside nodes_total are driven by these two inputs, so
    correlating them changes how often each constraint binds.'
