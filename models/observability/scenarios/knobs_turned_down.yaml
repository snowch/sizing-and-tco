scenario: knobs_turned_down
title: The four knobs, turned down
because: >-
  The same estate with one knob of each kind turned down: the scrape interval, metrics retention,
  the share of log lines kept, and the trace sampling rate. Appendix F sets this scenario beside the
  reference scenario to show what the knobs buy. None of the four knobs touches label cardinality,
  so the active series count and the query path do not move.
samples: 100000
seed: 20260916
overrides:
  scrape_interval: 60
  metrics_retention: 90
  log_keep_rate: 0.1
  trace_keep_rate: 0.01
