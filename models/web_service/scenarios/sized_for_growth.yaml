scenario: sized_for_growth
title: Sized for the growth we might get, not the growth we expect
because: >-
  The reference scenario buys what the point estimates recommend, and the model then puts a good
  share of its futures past the limit on utilisation at the busy hour and past the working set's
  margin. This scenario buys the fleet the model recommends when annual growth is at the high end
  of its band—one future in ten grows faster—with every other input at its point estimate. The two
  scenarios sit side by side so the trade-off is visible in numbers. Five of the six ceilings
  fall. One rises into its margin: the share of the fleet doing nothing useful, because each added
  host brings less capacity than the last (ch07). The decision between them is a judgement that
  the person who signs for the fleet makes and defends (ch21).
