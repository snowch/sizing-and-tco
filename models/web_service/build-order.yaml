# How the web service model is built, one chapter at a time.
#
# The book introduces this model a few nodes at a time, and each chapter shows the file as it
# stands at the end of it. Those files are *derived from model.yaml* rather than kept beside it:
# a second copy would drift, and the book would go on describing a model the repository no
# longer has. `bench/stages.py` builds them, `tests/test_stages.py` checks that every node is
# introduced by some chapter, that a stage never takes anything away, and that the
# classification flips exactly where the book says it does.
#
# `introduces` is the whole of it. Every node in model.yaml appears in exactly one stage, and a
# stage whose nodes refer to something no earlier stage introduced will not load.
#
# The model becomes a conditional model in ch06, when the first ceiling arrives, and not in ch09 when
# the measured constant does. Part II is about ceilings, and this is what that means for the file.

# How a stage refers to the model in its one-line description.
describe: web service model

# Two inputs are plain numbers until ch04 gives them shapes. A stage before that declares the
# value somebody would have chosen, and a provenance that says the distribution is coming — the
# only edit a stage may make to a node, because any other would let it show something the
# finished model does not say.
certain_until:
  annual_growth:
    stage: uncertainty
    value: 1.3
    source: >-
      ch02 - one growth rate, chosen rather than measured. ch04 gives it a shape, because
      a single number cannot say how sure anybody is of it.
  peak_request_rate_t0:
    stage: uncertainty
    value: 8000
    source: >-
      ch02 - the busy hour, as one number. ch04 gives it a shape, because an
      engineer who gives you this figure is giving you a range and rounding it.
  os_reserve:
    stage: uncertainty
    value: 0.1
    source: >-
      ch03 - the share of memory the kernel, the agents and the page cache floor keep before the
      service sees any, as one number. ch04 gives it a shape, because it differs from host to
      host and nobody has measured it on these.

stages:
  - stage: demand_inputs_single
    chapter: what_a_workload_is
    title: The first quantity
    classification: definitional
    outputs:
      - peak_request_rate_t0
    introduces:
      - peak_request_rate_t0

  - stage: demand_inputs_initial
