model: service_tier
title: A request-serving tier — queueing, and what more machines buy
currency: USD

description: >-
  The smallest model in the book, and the one that is not a chain of multiplications. Part II is
  about ceilings: the places where a system stops behaving like the product of its inputs and
  starts behaving like something else. This model has two of them.

  The first is the queueing knee. Waiting time is not proportional to load; it is proportional to
  load divided by what is left of the machine, which means it is flat and then vertical. The
  second is what happens when you add machines to fix the first: sharing costs something, and past
  a point it costs more than the machine brings.

  Nothing here names a product. The shapes are properties of queues and of shared state, and they
  turn up in a database, a message broker, a web tier and a storage cluster alike.

nodes:

  # -- the workload -----------------------------------------------------------------------

  arrival_rate:
    kind: input
    unit: request/second
    label: arrival rate
    distribution: {triangular: {minimum: 1500.0, likely: 4000.0, maximum: 12000.0}}
    provenance:
      kind: assumption
      source: "ch03 - requests per second at the busy hour. Triangular because this is an
        engineer's min/likely/max and claiming more shape than that would be invention."
    range: [200, 20000]

  service_demand:
    kind: input
    unit: second * node / request
    label: service demand per request
    note: >-
      Node-seconds of work one request costs, which is not the same thing as how long a request
      takes. A request that occupies one node for six milliseconds has a service demand of six
      milliseconds whether it returns in six milliseconds or in six seconds - the difference
      between those two is queueing, and this model is about that difference.

      It is declared as an assumption and it should be a `rig` measurement (ch03). Nobody has
      taken one, and the model says so here rather than in a footnote.
    distribution: {triangular: {minimum: 0.004, likely: 0.006, maximum: 0.011}}
    provenance:
      kind: assumption
      source: "stated workload characteristic; belongs on the rig and has not been measured"
    range: [0.001, 0.05]

  one_node:
    kind: input
    unit: node
    value: 1
    note: "as elsewhere: a conversion has to be a node before the division means anything"
    provenance: {kind: fact, source: "definition"}

  one_request:
    kind: input
    unit: request
    value: 1
    provenance: {kind: fact, source: "definition"}

  # -- utilisation ------------------------------------------------------------------------

  nodes:
    kind: input
    unit: node
    value: 64
    label: nodes in the tier
    provenance: {kind: assumption, source: "the sizing decision for this tier"}
    range: [1, 200]

  busy_nodes:
    kind: derived
    unit: node
    label: nodes busy on average
    note: >-
      Arrival rate times service demand. It is a count of machines doing work, it has nothing to
      do with how many you own, and it is the numerator of every utilisation figure below.
    formula: arrival_rate * service_demand

  utilisation:
    kind: derived
    unit: dimensionless
    formula: busy_nodes / nodes

  utilisation_cap:
    kind: input
    unit: dimensionless
    label: utilisation the model will admit to
    note: >-
      A modelling choice, stated rather than hidden. The waiting-time formula below divides by
      what is left of the tier, so at a utilisation of one it divides by zero and returns
      infinity. Infinity is not a prediction. Past this point the formula has stopped describing a
      queue and started describing an arithmetic accident, so the model clamps and the ceiling
      reports that it is over.
    value: 0.98
    provenance: {kind: assumption, source: "where this model stops being about queues (ch06)"}

  effective_utilisation:
    kind: derived
    unit: dimensionless
    formula: min(utilisation, utilisation_cap)

  # -- waiting, and Little's law -----------------------------------------------------------

  service_seconds:
    kind: derived
    unit: second
    label: service time
    note: "service demand with the machine divided out: how long one request would take alone"
    formula: service_demand * one_request / one_node

  residence_time:
    kind: derived
    unit: second
    label: residence time
    note: >-
      Service time divided by the fraction of the tier that is idle. That single division is
      ch06's whole subject: it is nearly flat while there is slack and nearly vertical when there
      is not, and nothing about the arithmetic warns you which side you are on.
    formula: service_seconds / (1 - effective_utilisation)

  waiting_time:
    kind: derived
    unit: second
    label: time spent queueing
    formula: residence_time - service_seconds

  concurrency:
    kind: derived
    unit: request
    label: requests in the system
    note: >-
      Little's law, and the only relationship in Part II that is always true: the number of
      requests in a system is the rate they arrive at times how long each one stays. No
      distribution assumed, no queue discipline assumed, nothing assumed except that the system
      is in a steady state. ch05 is about what that buys and what it does not.
    formula: arrival_rate * residence_time

  queueing_headroom:
    kind: ceiling
    unit: dimensionless
    label: utilisation
    of: utilisation
    limit: 1
    headroom: 0.3
    because: >-
      Not a capacity limit: a tier at ninety per cent of capacity has not run out of anything, it
      has a queue in front of it. The margin is large because the cost of crossing it is paid in
      latency by every request, not in a failure somebody gets paged for (ch06).

  # -- what more machines buy ----------------------------------------------------------------

  node_count:
    kind: derived
    unit: dimensionless
    formula: nodes / one_node

  single_node_throughput:
    kind: input
    unit: request/second/node
    distribution: {triangular: {minimum: 100.0, likely: 145.0, maximum: 220.0}}
    provenance: {kind: vendor_claim, source: "throughput of one node alone, as quoted"}

  contention:
    kind: input
    unit: dimensionless
    label: contention
    note: >-
      The fraction of the work that cannot be done in parallel: a lock, a single writer, a shared
      queue. It costs a fixed share of every machine you add, so it flattens the scaling curve
      and never bends it downwards.
    distribution: {triangular: {minimum: 0.002, likely: 0.005, maximum: 0.015}}
    provenance: {kind: assumption, source: "ch07 - fitted from two measurements, where two exist"}

  crosstalk:
    kind: input
    unit: dimensionless
    label: crosstalk
    note: >-
      The cost of machines having to agree with each other, which grows with the number of pairs
      rather than the number of machines. This is the term that makes the curve turn over: past
      some count, the next machine costs more in agreement than it brings in work.
    distribution: {lognormal: {p10: 1.5e-5, p90: 9.0e-5}}
    provenance: {kind: assumption, source: "ch07 - fitted, and the hardest of the two to fit"}

  linear_throughput:
    kind: derived
    unit: request/second
    label: throughput if scaling were free
    formula: nodes * single_node_throughput

  achievable_throughput:
    kind: derived
    unit: request/second
    label: throughput the tier can actually reach
    note: >-
      The universal scalability law. One node's throughput times the count, divided by what
      contention and crosstalk take back. With crosstalk at zero it is Amdahl's ceiling; with both
      at zero it is the straight line nobody has ever measured.
    formula: linear_throughput / (1 + contention * (node_count - 1) + crosstalk * node_count * (node_count - 1))

  scaling_efficiency:
    kind: derived
    unit: dimensionless
    formula: achievable_throughput / linear_throughput

  scaling_loss:
    kind: ceiling
    unit: dimensionless
    label: fraction of the tier doing nothing useful
    of: 1 - scaling_efficiency
    limit: 1
    headroom: 0.5
    because: >-
      At half, one machine in two is paying for the other's coordination. There is no failure and
      nothing gets paged; the tier simply costs twice what its work is worth, and it will go on
      doing so until somebody looks. A budget is the only thing this ceiling protects, which is
      why the margin is the loosest in the book and why it is still worth declaring (ch07).

  peak_nodes:
    kind: derived
    unit: node
    label: where adding nodes stops helping
    note: >-
      Where the scalability curve turns over, from the two coefficients alone: the square root of
      one-minus-contention over crosstalk. Past it, throughput falls. It is a property of the
      software, not of the budget, and no amount of money moves it.
    formula: one_node * sqrt((1 - contention) / crosstalk)

  headroom_to_peak:
    kind: derived
    unit: dimensionless
    label: fraction of the peak already built
    formula: node_count / (peak_nodes / one_node)

  utilisation_including_coordination:
    kind: derived
    unit: dimensionless
    label: utilisation, counting coordination
    note: >-
      The same tier's utilisation, worked out from what it can actually deliver rather than from
      what one node could deliver alone. It is higher than the row above, always, and the gap is
      the work the machines are doing on each other's behalf.

      Reading those two rows next to each other is ch07's whole argument. The queueing view of
      Part II is not wrong; it is optimistic, and it is optimistic by a factor nobody notices
      until they measure the tier at two sizes and find the second one disappointing.
    formula: arrival_rate / achievable_throughput

  optimism:
    kind: derived
    unit: dimensionless
    label: how much the queueing view understated it
    formula: utilisation_including_coordination / utilisation

  coordination_headroom:
    kind: ceiling
    unit: dimensionless
    label: utilisation, counting coordination
    of: utilisation_including_coordination
    limit: 1
    headroom: 0.3
    because: >-
      The same queueing margin as above, applied to the capacity the tier actually has rather
      than to the capacity its parts would have had alone. Where the two ceilings disagree, this
      is the one that is about the system you own (ch07).

outputs:
  - utilisation
  - utilisation_including_coordination
  - optimism
  - residence_time
  - waiting_time
  - concurrency
  - busy_nodes
  - achievable_throughput
  - scaling_efficiency
  - peak_nodes
  - headroom_to_peak
  - queueing_headroom
  - scaling_loss
  - coordination_headroom

correlations:
  - a: arrival_rate
    b: service_demand
    rho: 0.4
    because: >-
      The unhappy one. A busier system is usually a slower one per request - caches miss more,
      locks are held longer, the garbage collector runs while somebody is waiting. Treating the
      two as independent understates the tail of every figure in this model, and it understates
      it exactly when the tier is busiest.
