<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 264" width="520" height="264" role="img" font-family="system-ui, sans-serif"><title>Monte Carlo convergence</title><rect width="520" height="264" fill="#ffffff"/><text x="16" y="20" font-size="11.5" fill="#263238">Two things that are easily confused, at rising sample counts</text><text x="16" y="34" font-size="9.5" fill="#546e7a">Both axes logarithmic. Only one of them is converging on anything</text><line x1="64.0" y1="218.0" x2="504.0" y2="218.0" stroke="#eceff1"/><text x="58" y="221.0" font-size="8.5" text-anchor="end" fill="#546e7a">$1k</text><line x1="64.0" y1="164.0" x2="504.0" y2="164.0" stroke="#eceff1"/><text x="58" y="167.0" font-size="8.5" text-anchor="end" fill="#546e7a">$10k</text><line x1="64.0" y1="110.0" x2="504.0" y2="110.0" stroke="#eceff1"/><text x="58" y="113.0" font-size="8.5" text-anchor="end" fill="#546e7a">$100k</text><line x1="64.0" y1="56.0" x2="504.0" y2="56.0" stroke="#eceff1"/><text x="58" y="59.0" font-size="8.5" text-anchor="end" fill="#546e7a">$1M</text><path d="M210.7,138.7 L504.0,192.7" fill="none" stroke="#b3413a" stroke-width="1.2" stroke-dasharray="4 3"/><text x="500.0" y="205.7" font-size="8.5" text-anchor="end" fill="#b3413a">one over the square root of n</text><path d="M64.0,65.2 L210.7,64.1 L357.3,64.1 L504.0,64.1" fill="none" stroke="#4a7ba7" stroke-width="1.8"/><circle cx="64.0" cy="65.2" r="3" fill="#4a7ba7"/><circle cx="210.7" cy="64.1" r="3" fill="#4a7ba7"/><circle cx="357.3" cy="64.1" r="3" fill="#4a7ba7"/><circle cx="504.0" cy="64.1" r="3" fill="#4a7ba7"/><text x="72.0" y="57.2" font-size="9" fill="#4a7ba7">width of the interval</text><path d="M64.0,110.7 L210.7,138.7 L357.3,155.4 L504.0,184.2" fill="none" stroke="#c8791a" stroke-width="1.8"/><circle cx="64.0" cy="110.7" r="3" fill="#c8791a"/><circle cx="210.7" cy="138.7" r="3" fill="#c8791a"/><circle cx="357.3" cy="155.4" r="3" fill="#c8791a"/><circle cx="504.0" cy="184.2" r="3" fill="#c8791a"/><text x="72.0" y="102.7" font-size="9" fill="#c8791a">gap between runs</text><line x1="64.0" y1="218.0" x2="504.0" y2="218.0" stroke="#90a4ae"/><line x1="64.0" y1="56.0" x2="64.0" y2="218.0" stroke="#90a4ae"/><text x="64.0" y="232" font-size="8.5" text-anchor="start" fill="#546e7a">100</text><text x="210.7" y="232" font-size="8.5" text-anchor="middle" fill="#546e7a">1,000</text><text x="357.3" y="232" font-size="8.5" text-anchor="middle" fill="#546e7a">10,000</text><text x="504.0" y="232" font-size="8.5" text-anchor="end" fill="#546e7a">100,000</text><text x="284" y="256" font-size="9.5" text-anchor="middle" fill="#455a64">samples drawn</text></svg>
