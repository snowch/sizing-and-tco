<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 254" width="680" height="254" role="img" font-family="system-ui, sans-serif"><title>The answer&#x27;s excess against how many inputs are out</title><rect width="680" height="254" fill="#ffffff"/><text x="20" y="22" font-size="12.5" font-weight="600" fill="#263238">How far the answer moves when every input is out the same way</text><rect x="172.0" y="45.0" width="34.2" height="19.3" fill="#9fc0dd"/><text x="162.0" y="57.2" text-anchor="end" font-size="11.5" fill="#263238">1 input a fifth high</text><text x="213.2" y="57.2" font-size="11.5" font-weight="600" fill="#263238">+20% <tspan font-weight="400" fill="#546e7a">(1.20× the answer)</tspan></text><rect x="172.0" y="73.3" width="75.3" height="19.3" fill="#4a7ba7"/><text x="162.0" y="85.5" text-anchor="end" font-size="11.5" fill="#263238">2 inputs a fifth high</text><text x="254.3" y="85.5" font-size="11.5" font-weight="600" fill="#263238">+44% <tspan font-weight="400" fill="#546e7a">(1.44× the answer)</tspan></text><rect x="172.0" y="101.7" width="124.6" height="19.3" fill="#9fc0dd"/><text x="162.0" y="113.8" text-anchor="end" font-size="11.5" fill="#263238">3 inputs a fifth high</text><text x="303.6" y="113.8" font-size="11.5" font-weight="600" fill="#263238">+73% <tspan font-weight="400" fill="#546e7a">(1.73× the answer)</tspan></text><rect x="172.0" y="130.0" width="183.8" height="19.3" fill="#9fc0dd"/><text x="162.0" y="142.2" text-anchor="end" font-size="11.5" fill="#263238">4 inputs a fifth high</text><text x="362.8" y="142.2" font-size="11.5" font-weight="600" fill="#263238">+107% <tspan font-weight="400" fill="#546e7a">(2.07× the answer)</tspan></text><rect x="172.0" y="158.3" width="254.8" height="19.3" fill="#9fc0dd"/><text x="162.0" y="170.5" text-anchor="end" font-size="11.5" fill="#263238">5 inputs a fifth high</text><text x="433.8" y="170.5" font-size="11.5" font-weight="600" fill="#263238">+149% <tspan font-weight="400" fill="#546e7a">(2.49× the answer)</tspan></text><rect x="172.0" y="186.7" width="340.0" height="19.3" fill="#9fc0dd"/><text x="162.0" y="198.8" text-anchor="end" font-size="11.5" fill="#263238">6 inputs a fifth high</text><text x="519.0" y="198.8" font-size="11.5" font-weight="600" fill="#263238">+199% <tspan font-weight="400" fill="#546e7a">(2.99× the answer)</tspan></text><text x="20" y="240" font-size="10.5" fill="#546e7a">Nothing cancels, because nothing makes the inputs disagree with each other.</text></svg>
