<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 256" width="500" height="256" role="img" font-family="system-ui, sans-serif"><title>Residence time against utilisation</title><rect width="500" height="256" fill="#ffffff"/><text x="16" y="20" font-size="11.5" fill="#263238">How much longer a request takes than it would on an idle fleet</text><text x="16" y="34" font-size="9.5" fill="#546e7a">The arrival rate moves; the software and the machines do not</text><line x1="351.6" y1="46.0" x2="351.6" y2="214.0" stroke="#c8791a" stroke-width="1" stroke-dasharray="3 3"/><text transform="rotate(-90 346.6 208)" x="346.6" y="208" font-size="9" fill="#c8791a">a 30% margin ends here</text><line x1="437.2" y1="46.0" x2="437.2" y2="214.0" stroke="#b3413a" stroke-width="1" stroke-dasharray="3 3"/><text transform="rotate(-90 432.2 208)" x="432.2" y="208" font-size="9" fill="#b3413a">a 10% margin ends here</text><path d="M94.8,213.4 L137.6,212.7 L180.4,211.8 L223.2,210.5 L266.0,208.8 L308.8,206.2 L351.6,201.9 L373.0,198.4 L394.4,193.2 L415.8,184.6 L437.2,167.2 L450.0,145.0 L458.6,115.3 L467.2,46.0" fill="none" stroke="#4a7ba7" stroke-width="2"/><circle cx="94.8" cy="213.4" r="2.4" fill="#4a7ba7"/><circle cx="137.6" cy="212.7" r="2.4" fill="#4a7ba7"/><circle cx="180.4" cy="211.8" r="2.4" fill="#4a7ba7"/><circle cx="223.2" cy="210.5" r="2.4" fill="#4a7ba7"/><circle cx="266.0" cy="208.8" r="2.4" fill="#4a7ba7"/><circle cx="308.8" cy="206.2" r="2.4" fill="#4a7ba7"/><circle cx="351.6" cy="201.9" r="2.4" fill="#4a7ba7"/><circle cx="373.0" cy="198.4" r="2.4" fill="#4a7ba7"/><circle cx="394.4" cy="193.2" r="2.4" fill="#4a7ba7"/><circle cx="415.8" cy="184.6" r="2.4" fill="#4a7ba7"/><circle cx="437.2" cy="167.2" r="2.4" fill="#4a7ba7"/><circle cx="450.0" cy="145.0" r="2.4" fill="#4a7ba7"/><circle cx="458.6" cy="115.3" r="2.4" fill="#4a7ba7"/><circle cx="467.2" cy="46.0" r="2.4" fill="#4a7ba7"/><line x1="52.0" y1="214.0" x2="480.0" y2="214.0" stroke="#90a4ae"/><line x1="52.0" y1="46.0" x2="52.0" y2="214.0" stroke="#90a4ae"/><text x="52.0" y="229" font-size="9" text-anchor="middle" fill="#546e7a">0%</text><text x="159.0" y="229" font-size="9" text-anchor="middle" fill="#546e7a">25%</text><text x="266.0" y="229" font-size="9" text-anchor="middle" fill="#546e7a">50%</text><text x="373.0" y="229" font-size="9" text-anchor="middle" fill="#546e7a">75%</text><text x="480.0" y="229" font-size="9" text-anchor="middle" fill="#546e7a">100%</text><text x="46" y="217.0" font-size="9" text-anchor="end" fill="#546e7a">1x</text><text x="46" y="135.6" font-size="9" text-anchor="end" fill="#546e7a">17x</text><text x="46" y="49.0" font-size="9" text-anchor="end" fill="#546e7a">33x</text><text x="266" y="248" font-size="9.5" text-anchor="middle" fill="#455a64">utilisation</text><text transform="rotate(-90 13 130)" x="13" y="130" font-size="9.5" text-anchor="middle" fill="#455a64">how much longer a request takes</text></svg>
