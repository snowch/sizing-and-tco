<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="500" height="250" role="img" font-family="system-ui, sans-serif"><title>Residence time against utilisation</title><rect width="500" height="250" fill="#ffffff"/><text x="16" y="20" font-size="11.5" fill="#263238">How much longer a request takes than it would on an idle tier</text><text x="16" y="34" font-size="9.5" fill="#546e7a">The arrival rate moves; the software and the machines do not</text><line x1="351.6" y1="40.0" x2="351.6" y2="208.0" stroke="#c8791a" stroke-width="1" stroke-dasharray="3 3"/><text transform="rotate(-90 346.6 202)" x="346.6" y="202" font-size="9" fill="#c8791a">a 30% margin ends here</text><line x1="437.2" y1="40.0" x2="437.2" y2="208.0" stroke="#b3413a" stroke-width="1" stroke-dasharray="3 3"/><text transform="rotate(-90 432.2 202)" x="432.2" y="202" font-size="9" fill="#b3413a">a 10% margin ends here</text><path d="M94.8,207.4 L137.6,206.7 L180.4,205.8 L223.2,204.5 L266.0,202.8 L308.8,200.2 L351.6,195.9 L373.0,192.4 L394.4,187.2 L415.8,178.6 L437.2,161.2 L450.0,139.0 L458.6,109.3 L467.2,40.0" fill="none" stroke="#4a7ba7" stroke-width="2"/><circle cx="94.8" cy="207.4" r="2.4" fill="#4a7ba7"/><circle cx="137.6" cy="206.7" r="2.4" fill="#4a7ba7"/><circle cx="180.4" cy="205.8" r="2.4" fill="#4a7ba7"/><circle cx="223.2" cy="204.5" r="2.4" fill="#4a7ba7"/><circle cx="266.0" cy="202.8" r="2.4" fill="#4a7ba7"/><circle cx="308.8" cy="200.2" r="2.4" fill="#4a7ba7"/><circle cx="351.6" cy="195.9" r="2.4" fill="#4a7ba7"/><circle cx="373.0" cy="192.4" r="2.4" fill="#4a7ba7"/><circle cx="394.4" cy="187.2" r="2.4" fill="#4a7ba7"/><circle cx="415.8" cy="178.6" r="2.4" fill="#4a7ba7"/><circle cx="437.2" cy="161.2" r="2.4" fill="#4a7ba7"/><circle cx="450.0" cy="139.0" r="2.4" fill="#4a7ba7"/><circle cx="458.6" cy="109.3" r="2.4" fill="#4a7ba7"/><circle cx="467.2" cy="40.0" r="2.4" fill="#4a7ba7"/><line x1="52.0" y1="208.0" x2="480.0" y2="208.0" stroke="#90a4ae"/><line x1="52.0" y1="40.0" x2="52.0" y2="208.0" stroke="#90a4ae"/><text x="52.0" y="223" font-size="9" text-anchor="middle" fill="#546e7a">0%</text><text x="159.0" y="223" font-size="9" text-anchor="middle" fill="#546e7a">25%</text><text x="266.0" y="223" font-size="9" text-anchor="middle" fill="#546e7a">50%</text><text x="373.0" y="223" font-size="9" text-anchor="middle" fill="#546e7a">75%</text><text x="480.0" y="223" font-size="9" text-anchor="middle" fill="#546e7a">100%</text><text x="46" y="211.0" font-size="9" text-anchor="end" fill="#546e7a">1x</text><text x="46" y="129.6" font-size="9" text-anchor="end" fill="#546e7a">17x</text><text x="46" y="43.0" font-size="9" text-anchor="end" fill="#546e7a">33x</text><text x="266" y="242" font-size="9.5" text-anchor="middle" fill="#455a64">utilisation</text><text transform="rotate(-90 13 124)" x="13" y="124" font-size="9.5" text-anchor="middle" fill="#455a64">how much longer a request takes</text></svg>
