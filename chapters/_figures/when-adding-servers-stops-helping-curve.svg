<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" width="500" height="260" role="img" font-family="system-ui, sans-serif"><title>Throughput against host count</title><rect width="500" height="260" fill="#ffffff"/><text x="16" y="20" font-size="11.5" fill="#263238">What more machines actually buy</text><text x="16" y="34" font-size="9.5" fill="#546e7a">The straight line is what a budget assumes. The curve is what the machines do</text><path d="M58.1,213.0 L60.2,208.1 L64.5,198.2 L73.0,178.4 L89.9,138.8 L123.8,59.6 L157.8,42.0 L191.7,42.0 L225.6,42.0 L268.0,42.0 L327.4,42.0 L395.2,42.0 L480.0,42.0" fill="none" stroke="#b3413a" stroke-width="1.2" stroke-dasharray="4 3"/><path d="M58.1,213.1 L60.2,208.3 L64.5,199.2 L73.0,182.4 L89.9,154.7 L123.8,118.1 L157.8,98.8 L191.7,90.2 L225.6,87.6 L268.0,89.2 L327.4,95.4 L395.2,104.3 L480.0,115.2" fill="none" stroke="#4a7ba7" stroke-width="2"/><text x="163.8" y="54" font-size="9" fill="#b3413a">the budget's line leaves the page at 96 hosts</text><circle cx="225.6" cy="87.6" r="4" fill="none" stroke="#b3413a" stroke-width="1.5"/><text x="225.6" y="77.6" font-size="9" text-anchor="middle" fill="#b3413a">past here it falls</text><line x1="56.0" y1="218.0" x2="480.0" y2="218.0" stroke="#90a4ae"/><line x1="56.0" y1="42.0" x2="56.0" y2="218.0" stroke="#90a4ae"/><text x="58.1" y="233" font-size="9" text-anchor="middle" fill="#546e7a">2</text><text x="123.8" y="233" font-size="9" text-anchor="middle" fill="#546e7a">64</text><text x="191.7" y="233" font-size="9" text-anchor="middle" fill="#546e7a">128</text><text x="327.4" y="233" font-size="9" text-anchor="middle" fill="#546e7a">256</text><text x="480.0" y="233" font-size="9" text-anchor="middle" fill="#546e7a">400</text><text x="268" y="252" font-size="9.5" text-anchor="middle" fill="#455a64">hosts</text><text x="50" y="46" font-size="9" text-anchor="end" fill="#546e7a">87k</text><text x="50" y="218" font-size="9" text-anchor="end" fill="#546e7a">0</text><text transform="rotate(-90 13 130)" x="13" y="130" font-size="9.5" text-anchor="middle" fill="#455a64">requests per second</text></svg>
