<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 258" width="660" height="258" role="img" font-family="system-ui, sans-serif"><title>What a year of driving to work costs</title><rect width="660" height="258" fill="#ffffff"/><text x="20" y="22" font-size="12.5" font-weight="600" fill="#263238">What a year of driving to work costs</text><text x="204.0" y="66" text-anchor="end" font-size="11.5" fill="#263238">days you drive in</text><line x1="250.0" y1="62.0" x2="528.0" y2="62.0" stroke="#9fc0dd" stroke-width="2"/><circle cx="389.0" cy="62.0" r="4.5" fill="#37474f"/><text x="389.0" y="51" text-anchor="middle" font-size="11" font-weight="600" fill="#37474f">210</text><text x="242" y="66" text-anchor="end" font-size="10.5" fill="#546e7a">190</text><text x="536" y="66" font-size="10.5" fill="#546e7a">230</text><text x="204.0" y="106" text-anchor="end" font-size="11.5" fill="#263238">litres, there and back</text><line x1="250.0" y1="102.0" x2="528.0" y2="102.0" stroke="#9fc0dd" stroke-width="2"/><circle cx="376.4" cy="102.0" r="4.5" fill="#37474f"/><text x="376.4" y="91" text-anchor="middle" font-size="11" font-weight="600" fill="#37474f">3.0</text><text x="242" y="106" text-anchor="end" font-size="10.5" fill="#546e7a">2.5</text><text x="536" y="106" font-size="10.5" fill="#546e7a">3.6</text><text x="204.0" y="146" text-anchor="end" font-size="11.5" fill="#263238">price a litre</text><line x1="250.0" y1="142.0" x2="528.0" y2="142.0" stroke="#9fc0dd" stroke-width="2"/><circle cx="361.2" cy="142.0" r="4.5" fill="#37474f"/><text x="361.2" y="131" text-anchor="middle" font-size="11" font-weight="600" fill="#37474f">$1.50</text><text x="242" y="146" text-anchor="end" font-size="10.5" fill="#546e7a">$1.30</text><text x="536" y="146" font-size="10.5" fill="#546e7a">$1.80</text><text x="204.0" y="200.0" text-anchor="end" font-size="11.5" fill="#263238">a year, from the middles</text><text x="250.0" y="200.0" font-size="11.5" font-weight="600" fill="#37474f">$945</text><text x="204.0" y="222.0" text-anchor="end" font-size="11.5" fill="#263238">a year, all three at their tops</text><text x="250.0" y="222.0" font-size="11.5" font-weight="600" fill="#b3413a">$1,490</text><text x="342" y="222" font-size="11.5" font-weight="600" fill="#b3413a">+58%</text><text x="20" y="246" font-size="10.5" fill="#546e7a">None of the three is more than 20% above its middle. Illustrative figures, not a measurement.</text></svg>
