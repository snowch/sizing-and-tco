<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" width="440" height="400" role="img" font-family="system-ui, sans-serif"><title>From a length of time to a count</title><rect width="440" height="400" fill="#ffffff"/><text x="16" y="22" font-size="15" fill="#263238">From a length of time to a count</text><rect x="40.0" y="40" width="360.0" height="62.0" rx="6" fill="#ffffff" stroke="#90a4ae"/><text x="54.0" y="64" font-size="13.5" fill="#546e7a">horizon</text><text x="386.0" y="66" font-size="17" text-anchor="end" fill="#263238">5 years</text><text x="54.0" y="88" font-size="13.5" fill="#263238">a length of time</text><line x1="220.0" y1="102.0" x2="220.0" y2="132.0" stroke="#90a4ae"/><text x="232.0" y="122.0" font-size="13.5" fill="#546e7a">divided by</text><rect x="40.0" y="132" width="360.0" height="62.0" rx="6" fill="#ffffff" stroke="#90a4ae"/><text x="54.0" y="156" font-size="13.5" fill="#546e7a">one_year</text><text x="386.0" y="158" font-size="17" text-anchor="end" fill="#263238">1 year</text><text x="54.0" y="180" font-size="13.5" fill="#263238">a length of time, true by definition</text><line x1="220.0" y1="194.0" x2="220.0" y2="224.0" stroke="#90a4ae"/><text x="232.0" y="214.0" font-size="13.5" fill="#546e7a">years ÷ years cancel</text><rect x="40.0" y="224" width="360.0" height="62.0" rx="6" fill="#dbe7f3" stroke="#90a4ae"/><text x="54.0" y="248" font-size="13.5" fill="#546e7a">horizon_periods</text><text x="386.0" y="250" font-size="17" text-anchor="end" fill="#263238">5</text><text x="54.0" y="272" font-size="13.5" fill="#263238">a count, with no unit</text><line x1="220.0" y1="286.0" x2="220.0" y2="316.0" stroke="#90a4ae"/><text x="232.0" y="306.0" font-size="13.5" fill="#546e7a">used as the exponent</text><rect x="40.0" y="316" width="360.0" height="62.0" rx="6" fill="#ffffff" stroke="#90a4ae"/><text x="54.0" y="340" font-size="13.5" fill="#546e7a">annual_growth ** horizon_periods</text><text x="386.0" y="342" font-size="17" text-anchor="end" fill="#263238">×3.7</text><text x="54.0" y="364" font-size="13.5" fill="#263238">the yearly factor, ×1.3, applied 5 times</text></svg>
