<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 186" width="560" height="186" role="img" font-family="system-ui, sans-serif"><title>A rate times a duration is an amount; a rate times a plain number is still a rate</title><rect width="560" height="186" fill="#ffffff"/><text x="16" y="20" font-size="11.5" fill="#263238">The unit check, drawn: what a rate becomes when it is multiplied</text><text x="96" y="56" font-size="13" fill="#263238" text-anchor="middle">requests</text><line x1="63" y1="62" x2="129" y2="62" stroke="#263238" stroke-width="1.2"/><text x="96" y="78" font-size="13" fill="#90a4ae" text-anchor="middle">second</text><line x1="73" y1="82" x2="119" y2="67" stroke="#263238" stroke-width="1.4"/><text x="168" y="67" font-size="13" fill="#263238" text-anchor="middle">×</text><rect x="202" y="46" width="71" height="26" rx="4" fill="#eceff1" stroke="#90a4ae"/><text x="238" y="64" font-size="13" fill="#90a4ae" text-anchor="middle">seconds</text><line x1="211" y1="68" x2="265" y2="53" stroke="#263238" stroke-width="1.4"/><text x="312" y="67" font-size="13" fill="#263238" text-anchor="middle">=</text><rect x="353" y="46" width="78" height="26" rx="4" fill="#eceff1" stroke="#90a4ae"/><text x="392" y="64" font-size="13" fill="#263238" text-anchor="middle">requests</text><text x="16" y="98" font-size="11.5" fill="#90a4ae">The seconds cancel. A rate times a duration is an amount.</text><text x="96" y="130" font-size="13" fill="#263238" text-anchor="middle">requests</text><line x1="63" y1="136" x2="129" y2="136" stroke="#263238" stroke-width="1.2"/><text x="96" y="152" font-size="13" fill="#263238" text-anchor="middle">second</text><text x="168" y="141" font-size="13" fill="#263238" text-anchor="middle">×</text><rect x="202" y="120" width="71" height="26" rx="4" fill="#eceff1" stroke="#90a4ae"/><text x="238" y="138" font-size="13" fill="#263238" text-anchor="middle">periods</text><text x="312" y="141" font-size="13" fill="#263238" text-anchor="middle">=</text><text x="392" y="130" font-size="13" fill="#263238" text-anchor="middle">requests</text><line x1="359" y1="136" x2="425" y2="136" stroke="#263238" stroke-width="1.2"/><text x="392" y="152" font-size="13" fill="#263238" text-anchor="middle">second</text><text x="16" y="172" font-size="11.5" fill="#90a4ae">A plain number cancels nothing. The answer is still a rate, and the check refuses it.</text></svg>
