<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 306" width="560" height="306" role="img" font-family="system-ui, sans-serif"><title>What the one number is silent about</title><rect width="560" height="306" fill="#ffffff"/><text x="20" y="22" font-size="12.5" font-weight="600" fill="#263238">What the one number is silent about</text><text x="140.0" y="66" text-anchor="end" font-size="11.5" fill="#263238">the arithmetic once</text><line x1="150.0" y1="62.0" x2="534.0" y2="62.0" stroke="#cfd8dc"/><line x1="203.7" y1="49" x2="203.7" y2="75" stroke="#b3413a" stroke-width="2.5"/><text x="203.7" y="43" text-anchor="middle" font-size="11" font-weight="600" fill="#b3413a">54 hosts</text><text x="140.0" y="131" text-anchor="end" font-size="11.5" fill="#263238">the inputs varying</text><rect x="150.0" y="131.4" width="23.7" height="26.6" fill="#9fc0dd"/><rect x="174.3" y="96.0" width="23.7" height="62.0" fill="#9fc0dd"/><rect x="198.6" y="104.9" width="23.7" height="53.1" fill="#9fc0dd"/><rect x="222.9" y="120.6" width="23.7" height="37.4" fill="#9fc0dd"/><rect x="247.2" y="132.0" width="23.7" height="26.0" fill="#9fc0dd"/><rect x="271.5" y="140.8" width="23.7" height="17.2" fill="#9fc0dd"/><rect x="295.8" y="146.0" width="23.7" height="12.0" fill="#9fc0dd"/><rect x="320.1" y="149.8" width="23.7" height="8.2" fill="#9fc0dd"/><rect x="344.4" y="152.3" width="23.7" height="5.7" fill="#9fc0dd"/><rect x="368.7" y="154.0" width="23.7" height="4.0" fill="#9fc0dd"/><rect x="393.0" y="154.9" width="23.7" height="3.1" fill="#9fc0dd"/><rect x="417.3" y="155.7" width="23.7" height="2.3" fill="#9fc0dd"/><rect x="441.6" y="156.4" width="23.7" height="1.6" fill="#9fc0dd"/><rect x="465.8" y="156.9" width="23.7" height="1.1" fill="#9fc0dd"/><rect x="490.1" y="157.0" width="23.7" height="1.0" fill="#9fc0dd"/><rect x="514.4" y="157.3" width="19.0" height="0.7" fill="#9fc0dd"/><line x1="150.0" y1="158.0" x2="534.0" y2="158.0" stroke="#cfd8dc"/><line x1="203.7" y1="88" x2="203.7" y2="158.0" stroke="#b3413a" stroke-width="2" stroke-dasharray="5 3"/><text x="150.0" y="173" font-size="10.5" fill="#546e7a">3</text><text x="534.0" y="173" text-anchor="end" font-size="10.5" fill="#546e7a">368 and past it (1,133 of them)</text><text x="140.0" y="246" text-anchor="end" font-size="11.5" fill="#263238">neither can reach</text><rect x="150.0" y="218.0" width="384.0" height="50" fill="none" stroke="#b3413a" stroke-width="1.4" stroke-dasharray="6 4" rx="4"/><text x="166" y="240" font-size="11" fill="#546e7a">a quantity nobody wrote down; a limit a chain of</text><text x="166" y="256" font-size="11" fill="#546e7a">multiplications cannot represent</text><text x="20" y="294" font-size="10.5" fill="#546e7a">The top two share one axis. The third is not on it, and that is the point.</text></svg>
