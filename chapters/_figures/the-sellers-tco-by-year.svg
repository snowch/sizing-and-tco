<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 380" width="440" height="380" role="img" font-family="system-ui, sans-serif"><title>Spend added up year by year, with the paybacks</title><rect width="440" height="380" fill="#ffffff"/><text x="16" y="22" font-size="15" fill="#263238">Spend added up year by year, ch22's customer</text><text x="16" y="42" font-size="13.5" fill="#546e7a">each proposal starts at the cost of the move</text><line x1="16" y1="60" x2="38" y2="60" stroke="#263238" stroke-width="2"/><text x="44" y="64" font-size="13.5" fill="#37474f">the customer as it is</text><line x1="16" y1="78" x2="38" y2="78" stroke="#c8791a" stroke-width="2" stroke-dasharray="4 2"/><text x="44" y="82" font-size="13.5" fill="#37474f">the brochure: pays back after 1.1 years</text><line x1="16" y1="96" x2="38" y2="96" stroke="#4a7ba7" stroke-width="2"/><text x="44" y="100" font-size="13.5" fill="#37474f">ch22&#x27;s two assumptions: pays back after 4.3 years</text><line x1="16" y1="114" x2="38" y2="114" stroke="#b3413a" stroke-width="2" stroke-dasharray="2 3"/><text x="44" y="118" font-size="13.5" fill="#37474f">the seller&#x27;s guesses: never pays back</text><path d="M20.0,336.0 L100.0,304.1 L180.0,272.3 L260.0,240.4 L340.0,208.5 L420.0,176.6" fill="none" stroke="#263238" stroke-width="2"/><path d="M20.0,316.1 L100.0,302.4 L180.0,288.7 L260.0,275.0 L340.0,261.3 L420.0,247.6" fill="none" stroke="#c8791a" stroke-width="2" stroke-dasharray="4 2"/><circle cx="107.6" cy="301.1" r="4" fill="#ffffff" stroke="#c8791a" stroke-width="1.6"/><path d="M20.0,316.1 L100.0,288.9 L180.0,261.7 L260.0,234.5 L340.0,207.2 L420.0,180.0" fill="none" stroke="#4a7ba7" stroke-width="2"/><circle cx="361.8" cy="199.8" r="4" fill="#ffffff" stroke="#4a7ba7" stroke-width="1.6"/><path d="M20.0,316.1 L100.0,282.1 L180.0,248.1 L260.0,214.0 L340.0,180.0 L420.0,146.0" fill="none" stroke="#b3413a" stroke-width="2" stroke-dasharray="2 3"/><line x1="20.0" y1="336.0" x2="420.0" y2="336.0" stroke="#90a4ae"/><line x1="20.0" y1="336.0" x2="20.0" y2="341.0" stroke="#90a4ae"/><text x="20.0" y="357.0" font-size="13.5" text-anchor="start" fill="#546e7a">0</text><line x1="100.0" y1="336.0" x2="100.0" y2="341.0" stroke="#90a4ae"/><text x="100.0" y="357.0" font-size="13.5" text-anchor="middle" fill="#546e7a">1</text><line x1="180.0" y1="336.0" x2="180.0" y2="341.0" stroke="#90a4ae"/><text x="180.0" y="357.0" font-size="13.5" text-anchor="middle" fill="#546e7a">2</text><line x1="260.0" y1="336.0" x2="260.0" y2="341.0" stroke="#90a4ae"/><text x="260.0" y="357.0" font-size="13.5" text-anchor="middle" fill="#546e7a">3</text><line x1="340.0" y1="336.0" x2="340.0" y2="341.0" stroke="#90a4ae"/><text x="340.0" y="357.0" font-size="13.5" text-anchor="middle" fill="#546e7a">4</text><line x1="420.0" y1="336.0" x2="420.0" y2="341.0" stroke="#90a4ae"/><text x="420.0" y="357.0" font-size="13.5" text-anchor="end" fill="#546e7a">5</text><text x="20.0" y="150.0" font-size="13.5" fill="#546e7a">$2,387,089</text><text x="220" y="374" font-size="13.5" text-anchor="middle" fill="#455a64">years after the move</text></svg>
