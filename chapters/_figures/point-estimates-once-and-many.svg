<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 236" width="560" height="236" role="img" font-family="system-ui, sans-serif"><title>The same arithmetic, run once and run many times</title><rect width="560" height="236" fill="#ffffff"/><text x="20" y="22" font-size="12.5" font-weight="600" fill="#263238">The same arithmetic, run once and run 100,000 times</text><text x="120.0" y="70" text-anchor="end" font-size="11.5" fill="#263238">run once</text><line x1="132.0" y1="66.0" x2="534.0" y2="66.0" stroke="#cfd8dc"/><line x1="188.2" y1="53" x2="188.2" y2="79" stroke="#b3413a" stroke-width="2.5"/><text x="188.2" y="47" text-anchor="middle" font-size="11" font-weight="600" fill="#b3413a">54 hosts</text><text x="120.0" y="130" text-anchor="end" font-size="11.5" fill="#263238">run again with every</text><text x="120.0" y="145" text-anchor="end" font-size="11.5" fill="#263238">input free to move</text><rect x="132.0" y="138.0" width="24.8" height="30.0" fill="#9fc0dd"/><rect x="157.4" y="98.0" width="24.8" height="70.0" fill="#9fc0dd"/><rect x="182.9" y="108.1" width="24.8" height="59.9" fill="#9fc0dd"/><rect x="208.3" y="125.8" width="24.8" height="42.2" fill="#9fc0dd"/><rect x="233.7" y="138.6" width="24.8" height="29.4" fill="#9fc0dd"/><rect x="259.2" y="148.6" width="24.8" height="19.4" fill="#9fc0dd"/><rect x="284.6" y="154.4" width="24.8" height="13.6" fill="#9fc0dd"/><rect x="310.0" y="158.7" width="24.8" height="9.3" fill="#9fc0dd"/><rect x="335.5" y="161.6" width="24.8" height="6.4" fill="#9fc0dd"/><rect x="360.9" y="163.5" width="24.8" height="4.5" fill="#9fc0dd"/><rect x="386.3" y="164.5" width="24.8" height="3.5" fill="#9fc0dd"/><rect x="411.8" y="165.4" width="24.8" height="2.6" fill="#9fc0dd"/><rect x="437.2" y="166.1" width="24.8" height="1.9" fill="#9fc0dd"/><rect x="462.7" y="166.8" width="24.8" height="1.2" fill="#9fc0dd"/><rect x="488.1" y="166.8" width="24.8" height="1.2" fill="#9fc0dd"/><rect x="513.5" y="167.2" width="19.9" height="0.8" fill="#9fc0dd"/><line x1="132.0" y1="168.0" x2="534.0" y2="168.0" stroke="#cfd8dc"/><line x1="188.2" y1="90" x2="188.2" y2="168.0" stroke="#b3413a" stroke-width="2" stroke-dasharray="5 3"/><text x="132.0" y="184" font-size="10.5" fill="#546e7a">3 hosts</text><text x="534.0" y="184" text-anchor="end" font-size="10.5" fill="#546e7a">368 hosts, and 1,133 answers past this edge</text><text x="20" y="224" font-size="10.5" fill="#546e7a">More than half the answers came out above the single number.</text></svg>
