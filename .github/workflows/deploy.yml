name: Deploy book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on if it is off. Without it the very first deploy fails with a 404 on a
          # repository setting nobody has been told about, which is exactly what happened.
          #
          # It does NOT change the build type of a site that already exists. If the deploy job
          # below fails in a couple of seconds having run no steps and written no log, that is
          # what has happened: Settings -> Pages -> Source has to say "GitHub Actions" rather than
          # "Deploy from a branch", and no workflow can set it.
          enablement: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install MyST CLI (pinned)
        # Pinned via package.json so a build that worked yesterday cannot break with no commit.
        run: npm install -g "mystmd@$(node -p "require('./package.json').devDependencies.mystmd")"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Pages contain no executable cells. Every figure is a committed fragment rendered from a
      # stamped result, so publishing the book needs neither a Jupyter kernel nor a model run —
      # which removes a whole class of deploy failure that has nothing to do with the book.
      - name: Check the figures are current
        run: python3 scripts/render-figures.py --check

      # Names the commit this deploy came from, so a reader can tell whether the page they are
      # looking at is the current one. Not a committed figure: it would be stale on arrival.
      - name: Stamp the build with its commit
        run: python3 scripts/build-stamp.py

      # MyST parses and resolves every cross-reference; it no longer renders. Without --html it
      # never reaches the template registry, so this step needs nothing but the repository — and
      # `make check` runs exactly the same two commands on a laptop.
      - name: Parse the book
        env:
          # base_path is "/" for a user site and "/repo" for a project site; MyST wants an empty
          # string at the root. Without this every asset and link 404s under /sizing-and-tco/.
          BASE_URL: ${{ steps.pages.outputs.base_path == '/' && '' || steps.pages.outputs.base_path }}
        run: myst build --strict

      - name: Render the book
        run: python3 scripts/build-site.py --out _build/html

      - name: Build the interactive model pages
        # One self-contained file per model and scenario, built from the same stamped results the
        # chapters' figures come from — so the book and the browser cannot disagree.
        run: |
          python3 scripts/build-viewers.py --out _build/html/models

      # ch01 claims you get a range by running the arithmetic again and again. This is the page
      # that lets a reader do it, one press at a time, from the spreads the same stamped result
      # declares. Embedded in the chapter by a `/futures/...` URL.
      - name: Build the one-future-at-a-time page
        run: python3 scripts/build-futures.py --out _build/html/futures

      # The renderer sets a favicon and nothing else. A manifest and an apple-touch-icon are what
      # a phone reads when somebody saves the page to a home screen, and they have to be at the
      # site root with a link in every page's head — so this copies them in and adds the links.
      - name: Add the site icons
        env:
          BASE_URL: ${{ steps.pages.outputs.base_path == '/' && '' || steps.pages.outputs.base_path }}
        run: python3 scripts/build-icons.py --inject _build/html --base "${BASE_URL:-}/"

      # After every page and viewer is in place and the icons are in, because the
      # worker lists all of them: on the first visit a browser fetches the list and keeps it, and
      # from then on the book opens with no network.
      - name: Make the book installable for offline use
        env:
          BASE_URL: ${{ steps.pages.outputs.base_path == '/' && '' || steps.pages.outputs.base_path }}
        run: python3 scripts/build-offline.py --inject _build/html --base "${BASE_URL:-}/"

      # After every model page is in place and the icons have given their links
      # the base path, so links into them are checked against files that exist at the address a
      # reader will ask for. ci-check.sh runs the same check at the site root; only here is the
      # site assembled under the base path it is served from, and a root-relative link that
      # forgot the base path is the fault the local check cannot see.
      - name: Check every file the pages link to was built
        env:
          BASE_URL: ${{ steps.pages.outputs.base_path == '/' && '' || steps.pages.outputs.base_path }}
        run: python3 scripts/check-built-links.py _build/html "$BASE_URL"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_build/html"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.page.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 1800000

      - name: Backoff before retry
        if: ${{ steps.deploy1.outcome != 'success' }}
        run: sleep 60

      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy2
        if: ${{ steps.deploy1.outcome != 'success' }}
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000

      - name: Expose page URL (from the successful attempt)
        id: page
        if: ${{ always() }}
        run: echo "page_url=${{ steps.deploy2.outputs.page_url || steps.deploy1.outputs.page_url }}" >> $GITHUB_OUTPUT
