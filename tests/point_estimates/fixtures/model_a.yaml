# Problem 1.3's Model A, written as a model file. An exercise fixture: nothing in it is measured
# and nothing in it is one of the book's models. The test asks the toolkit what kind of model
# each of the three files is, and grades the reader's answer against that; it lives under tests/
# so that it can never be mistaken for a figure the book publishes.
model: problem_1_3_a
title: Model A (exercise fixture)

nodes:
  peak_rate:
    kind: input
    unit: request/second
    label: peak requests per second
    distribution: {triangular: {minimum: 3000.0, likely: 8000.0, maximum: 20000.0}}
    provenance: {kind: assumption, source: "exercise fixture: a forecast"}

  processor_time:
    kind: input
    unit: second * core / request
    label: processor time per request
    distribution: {triangular: {minimum: 0.0003, likely: 0.0005, maximum: 0.0009}}
    provenance: {kind: assumption, source: "exercise fixture: an estimate nobody has measured"}

  busy_cores:
    kind: derived
    unit: core
    label: cores busy at the peak
    formula: peak_rate * processor_time

outputs:
  - busy_cores
