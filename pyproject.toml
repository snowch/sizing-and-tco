[project]
name = "sizing-and-tco"
version = "0.0.0"
description = "The model-as-code toolkit and measurement harness for the Sizing and TCO book"
authors = [{ name = "Chris Snow" }]
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
include = ["sizing*", "bench*"]

[tool.ruff]
exclude = [".git", ".github", ".venv", "__pycache__", "_build", "build", "dist"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line length is the formatter's job
    "E402",   # module-level import not at top (scripts insert ROOT on sys.path first)
    "B008",   # function call in argument defaults
    "SIM108", # a ternary is not always clearer in teaching code
]
fixable = ["ALL"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["sizing", "bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "rig: needs the reference machine. Timing runs only; skipped anywhere else.",
    "node: needs a node binary, to run the browser evaluator against Python's. Skipped without one.",
    "problem: a chapter problem for the reader to solve. Fails until solved, which is the point;\n         CI deselects these with -m 'not problem' and checks the scaffolding instead.",
]
# So `pytest` works in a fresh clone with no install step: the repo root holds sizing/ and bench/.
pythonpath = ["."]
