dsl: 2
model: growth_shapes
title: Growth shapes
currency: USD
description: The three growth shapes, from one starting rate over one count of periods.
nodes:
  start_rate:
    kind: input
    decided: outside
    unit: request/second
    value: 100
    provenance: {kind: assumption, source: a test value}
  factor:
    kind: input
    decided: outside
    unit: dimensionless
    value: 1.3
    provenance: {kind: assumption, source: a test value}
  rise:
    kind: input
    decided: outside
    unit: request/second
    value: 30
    provenance: {kind: assumption, source: a test value}
  market_ceiling:
    kind: input
    decided: outside
    unit: request/second
    value: 400
    provenance: {kind: assumption, source: a test value}
  periods:
    kind: input
    decided: definition
    unit: dimensionless
    value: 5
    provenance: {kind: fact, source: definition}
  compounded:
    kind: grown
    unit: request/second
    shape: compound
    start: start_rate
    rate: factor
    over: periods
  added:
    kind: grown
    unit: request/second
    shape: linear
    start: start_rate
    rate: rise
    over: periods
  levelled:
    kind: grown
    unit: request/second
    shape: levelling
    start: start_rate
    rate: rise
    over: periods
    ceiling: market_ceiling
outputs: [compounded, added, levelled]
