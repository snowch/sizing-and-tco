# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  id: sizing-and-tco
  title: Sizing and TCO
  description: >-
    Capacity planning, sizing and total cost of ownership, modelled as code. A self-study text
    and toolkit built on one rule: every number says where it came from, and every model the book
    publishes is a file the build re-runs.
  keywords:
    - capacity planning
    - sizing
    - total cost of ownership
    - monte carlo
    - uncertainty
    - unit economics
    - observability
    - storage
  authors:
    - name: Chris Snow
      url: https://snowch.github.io
  github: https://github.com/snowch/sizing-and-tco
  # Drawn by scripts/build-icons.py, which also injects the link tags the themes will not.
  # Listed one by one because static_files copies by basename, so naming the folder would put
  # them under /public/ instead of at the site root, where a manifest and an apple-touch-icon
  # have to be.
  static_files:
    - public/favicon.svg
    - public/favicon-32.png
    - public/favicon-16.png
    - public/apple-touch-icon.png
    - public/icon-192.png
    - public/icon-512.png
    - public/site.webmanifest
  license:
    content: CC-BY-NC-4.0
    code: Apache-2.0
  settings:
    # This book prints money as $4,150,036 and intervals as "$318,062 to $611,522". With
    # dollar-maths on, MyST reads the span between two dollar signs as LaTeX and KaTeX sets
    # "to" as the variables t and o — eighty lines across twenty generated tables, on every
    # page that carried one. The book contains no inline maths at all, so the extension has
    # nothing to offer and one thing to break. tests/test_book.py holds it off.
    parser:
      dollarmath: false
  bibliography:
    - references.bib
  exclude:
    - README.md
    - PLAN.md
    - CLAUDE.md
    - AUTHORING_GUIDE.md
    - NEXT_STEPS.md
    - BUILD-FROM-SCRATCH-PROMPT.md
  toc:
    - file: index.md
      title: Preface

    - file: parts/what_you_are_sizing.md
      children:
        - file: chapters/point_estimates.md
        - file: chapters/what_a_workload_is.md
        - file: chapters/where_the_numbers_come_from.md
        - file: chapters/peak_mean_and_growth.md

    - file: parts/ceilings.md
      children:
        - file: chapters/littles_law.md
        - file: chapters/queueing_and_the_knee.md
        - file: chapters/when_adding_servers_stops_helping.md
        - file: chapters/regime_changes.md

    - file: parts/sizing.md
      children:
        - file: chapters/capacity.md
        - file: chapters/bandwidth_and_the_binding_constraint.md
        - file: chapters/headroom_and_failure_domains.md
        - file: chapters/the_sizing_model.md

    - file: parts/uncertainty.md
      children:
        - file: chapters/monte_carlo.md
        - file: chapters/correlation_and_convergence.md

    - file: parts/cost.md
      children:
        - file: chapters/capex_opex_and_lifecycle.md
        - file: chapters/power_first.md
        - file: chapters/unit_economics.md
        - file: chapters/the_five_year_model.md

    - file: parts/sensitivity.md
      children:
        - file: chapters/which_input_is_the_answer.md
        - file: chapters/the_missing_node.md

    - file: parts/presenting_it.md
      children:
        - file: chapters/a_tco_for_finance.md
        - file: chapters/comparing_two_tcos.md

    - file: parts/afterwards.md
      children:
        - file: chapters/what_the_model_got_wrong.md

    - title: Appendices
      children:
        - file: appendices/appendix_a_dsl_reference.md
        - file: appendices/appendix_b_monte_carlo_module.md
        - file: appendices/appendix_c_distributions.md
        - file: appendices/appendix_d_units.md
        - file: appendices/appendix_e_web_service_model.md
        - file: appendices/appendix_f_observability_model.md
        - file: appendices/appendix_g_glossary.md
        - file: appendices/appendix_h_running_the_toolkit.md

site:
  template: book-theme
  title: Sizing and TCO
  options:
    logo_text: Sizing and TCO
    favicon: ./public/favicon.svg
  nav:
    - title: Chris Snow
      url: https://snowch.github.io
    - title: GitHub
      url: https://github.com/snowch/sizing-and-tco
